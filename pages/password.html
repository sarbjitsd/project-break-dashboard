<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contraseñas — Dashboard</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/password.css" />
</head>
<body>

  <nav class="navbar">
    <a class="navbar__logo" href="../index.html">JS</a>
    <ul class="navbar__links">
      <li><a href="clock.html">Reloj</a></li>
      <li><a href="weather.html">Meteo</a></li>
      <li><a href="password.html" class="active">Contraseñas</a></li>
      <li><a href="links.html">Links</a></li>
    </ul>
  </nav>

  <div class="container fade-in">
    <a href="../index.html" class="back-link">← Volver al Dashboard</a>

    <h1 class="section-title">🔐 Generador de Contraseñas</h1>

    <div class="card pass-card">
      <div class="pass-output-row">
        <code class="pass-output" id="pass-output">Pulsa generar…</code>
        <button class="btn" id="copy-btn">📋 Copiar</button>
      </div>

      <div class="strength-row">
        <span class="label" style="margin:0">Fortaleza:</span>
        <div class="strength-bar-wrap">
          <div class="strength-bar" id="strength-bar"></div>
        </div>
        <span class="strength-text" id="strength-text">—</span>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="field-row">
        <div style="flex:1">
          <label class="label" for="length-range">
            Longitud: <strong id="length-display">16</strong> caracteres
          </label>
          <input type="range" id="length-range" min="12" max="50" value="16" />
          <div class="range-limits"><span>12</span><span>50</span></div>
        </div>
      </div>

      <hr />

      <div class="checks-grid">
        <label class="check-row"><input type="checkbox" id="use-upper" checked /> Mayúsculas (A–Z)</label>
        <label class="check-row"><input type="checkbox" id="use-lower" checked /> Minúsculas (a–z)</label>
        <label class="check-row"><input type="checkbox" id="use-numbers" checked /> Números (0–9)</label>
        <label class="check-row"><input type="checkbox" id="use-symbols" checked /> Símbolos (!@#…)</label>
      </div>

      <button class="btn btn--primary" id="gen-btn" style="margin-top:20px;width:100%">
        Generar contraseña →
      </button>
    </div>

    <div class="card" style="margin-top:12px">
      <p class="label">Historial de esta sesión</p>
      <ul class="history-list" id="history-list">
        <li class="history-empty">Todavía no has generado ninguna.</li>
      </ul>
    </div>

  </div>

  <footer class="footer">© 2026 Mi Dashboard — Proyecto Bootcamp</footer>
  <script src="../js/password.js"></script>
  <script src="../js/bg.js"></script>
</body>
</html>
